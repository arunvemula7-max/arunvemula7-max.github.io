<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="NLP Text Analysis with Streamlit">
  <title>Text Analysis using NLP</title>
  <rect width="640" height="400" fill="#9bc1bc"/>
  <!-- Browser frame -->
  <g>
    <rect x="40" y="40" width="560" height="320" rx="16" fill="#edf1e8" stroke="#141414" stroke-width="2"/>
    <rect x="40" y="40" width="560" height="32" rx="16" fill="#d7dbd2"/>
    <g fill="#ed6a5a">
      <circle cx="60" cy="56" r="5"/>
    </g>
    <g fill="#f4f1bb">
      <circle cx="78" cy="56" r="5"/>
    </g>
    <g fill="#9bc1bc">
      <circle cx="96" cy="56" r="5"/>
    </g>
    <text x="320" y="60" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#141414" opacity="0.6">streamlit.app · text-analysis</text>
  </g>
  <!-- Input textarea -->
  <rect x="64" y="92" width="510" height="80" rx="8" fill="#d7dbd2" stroke="#5d576b" stroke-width="1.5"/>
  <text x="76" y="116" font-family="Space Mono, monospace" font-size="11" fill="#141414">"The quarterly results exceeded analyst</text>
  <text x="76" y="132" font-family="Space Mono, monospace" font-size="11" fill="#141414">expectations, driving the stock up 8%..."</text>
  <text x="76" y="160" font-family="Space Mono, monospace" font-size="9" fill="#5d576b">42 WORDS · 3 SENTENCES</text>
  <!-- Output cards -->
  <g font-family="Space Mono, monospace" font-size="10">
    <g>
      <rect x="64" y="190" width="160" height="70" rx="8" fill="#5d576b"/>
      <text x="78" y="208" fill="#9bc1bc">SENTIMENT</text>
      <text x="78" y="236" fill="#edf1e8" font-size="22" font-weight="700">POSITIVE</text>
      <text x="78" y="252" fill="#f4f1bb">+0.84</text>
    </g>
    <g>
      <rect x="240" y="190" width="160" height="70" rx="8" fill="#ed6a5a"/>
      <text x="254" y="208" fill="#141414">ENTITIES</text>
      <text x="254" y="236" fill="#141414" font-size="22" font-weight="700">7</text>
      <text x="254" y="252" fill="#141414">ORG · MONEY · DATE</text>
    </g>
    <g>
      <rect x="416" y="190" width="158" height="70" rx="8" fill="#f4f1bb"/>
      <text x="430" y="208" fill="#141414">TOPICS</text>
      <text x="430" y="236" fill="#141414" font-size="18" font-weight="700">FINANCE</text>
      <text x="430" y="252" fill="#5d576b">earnings · stocks</text>
    </g>
  </g>
  <!-- Token highlights -->
  <g font-family="Space Mono, monospace" font-size="11" fill="#141414">
    <rect x="64" y="280" width="58" height="22" rx="11" fill="#9bc1bc"/>
    <text x="93" y="295" text-anchor="middle">quarterly</text>
    <rect x="130" y="280" width="48" height="22" rx="11" fill="#f4f1bb"/>
    <text x="154" y="295" text-anchor="middle">results</text>
    <rect x="186" y="280" width="60" height="22" rx="11" fill="#ed6a5a"/>
    <text x="216" y="295" text-anchor="middle">analyst</text>
    <rect x="254" y="280" width="78" height="22" rx="11" fill="#9bc1bc"/>
    <text x="293" y="295" text-anchor="middle">expectations</text>
  </g>
  <!-- Header -->
  <text x="40" y="386" font-family="Space Mono, monospace" font-size="10" fill="#141414" letter-spacing="3">NLTK · SPACY · STREAMLIT</text>
</svg>
