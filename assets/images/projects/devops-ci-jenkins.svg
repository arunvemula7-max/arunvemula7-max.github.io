<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="CI/CD Pipeline with Jenkins">
  <title>DevOps CI/CD Pipeline</title>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d576b"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg1)"/>
  <!-- Pipeline stages -->
  <g font-family="Space Mono, monospace" font-size="13" fill="#edf1e8" text-anchor="middle">
    <g>
      <rect x="50" y="160" width="110" height="80" rx="14" fill="none" stroke="#9bc1bc" stroke-width="2"/>
      <text x="105" y="195">COMMIT</text>
      <text x="105" y="215" font-size="10" fill="#9bc1bc">git push</text>
    </g>
    <g>
      <rect x="195" y="160" width="110" height="80" rx="14" fill="none" stroke="#f4f1bb" stroke-width="2"/>
      <text x="250" y="195">BUILD</text>
      <text x="250" y="215" font-size="10" fill="#f4f1bb">jenkins</text>
    </g>
    <g>
      <rect x="340" y="160" width="110" height="80" rx="14" fill="none" stroke="#ed6a5a" stroke-width="2"/>
      <text x="395" y="195">TEST</text>
      <text x="395" y="215" font-size="10" fill="#ed6a5a">pytest</text>
    </g>
    <g>
      <rect x="485" y="160" width="110" height="80" rx="14" fill="#ed6a5a" stroke="#ed6a5a" stroke-width="2"/>
      <text x="540" y="195" fill="#141414" font-weight="700">DEPLOY</text>
      <text x="540" y="215" font-size="10" fill="#141414">docker</text>
    </g>
  </g>
  <!-- Arrows -->
  <g stroke="#edf1e8" stroke-width="2" fill="none" opacity="0.6">
    <path d="M160 200 L195 200" marker-end="url(#arr)"/>
    <path d="M305 200 L340 200" marker-end="url(#arr)"/>
    <path d="M450 200 L485 200" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#edf1e8"/>
    </marker>
  </defs>
  <!-- Header label -->
  <text x="40" y="60" font-family="Playfair Display, serif" font-style="italic" font-size="28" fill="#edf1e8">CI / CD</text>
  <text x="40" y="90" font-family="Space Mono, monospace" font-size="11" fill="#9bc1bc" letter-spacing="3">JENKINS · DOCKER · GITHUB ACTIONS</text>
  <!-- Decorative gear -->
  <g transform="translate(560 70)" fill="#f4f1bb" opacity="0.85">
    <circle r="22" fill="none" stroke="#f4f1bb" stroke-width="3"/>
    <circle r="7"/>
    <g>
      <rect x="-3" y="-30" width="6" height="10" rx="1"/>
      <rect x="-3" y="20" width="6" height="10" rx="1"/>
      <rect x="-30" y="-3" width="10" height="6" rx="1"/>
      <rect x="20" y="-3" width="10" height="6" rx="1"/>
    </g>
  </g>
</svg>
