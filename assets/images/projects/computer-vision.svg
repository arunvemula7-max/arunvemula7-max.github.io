<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Computer Vision Projects">
  <title>Computer Vision Projects</title>
  <rect width="640" height="400" fill="#141414"/>
  <!-- Scanlines -->
  <g stroke="#9bc1bc" stroke-width="0.6" opacity="0.18">
    <path d="M0 30 H640 M0 90 H640 M0 150 H640 M0 210 H640 M0 270 H640 M0 330 H640 M0 390 H640"/>
  </g>
  <!-- Detection brackets around faces/objects -->
  <g stroke-width="2.5" fill="none">
    <g stroke="#ed6a5a">
      <path d="M140 130 L140 110 L160 110"/>
      <path d="M260 110 L280 110 L280 130"/>
      <path d="M280 220 L280 240 L260 240"/>
      <path d="M160 240 L140 240 L140 220"/>
    </g>
    <text x="142" y="104" font-family="Space Mono, monospace" font-size="10" fill="#ed6a5a">person 0.97</text>
    <g stroke="#f4f1bb">
      <path d="M340 200 L340 180 L360 180"/>
      <path d="M460 180 L480 180 L480 200"/>
      <path d="M480 290 L480 310 L460 310"/>
      <path d="M360 310 L340 310 L340 290"/>
    </g>
    <text x="342" y="174" font-family="Space Mono, monospace" font-size="10" fill="#f4f1bb">car 0.92</text>
    <g stroke="#9bc1bc">
      <path d="M70 250 L70 230 L90 230"/>
      <path d="M170 230 L190 230 L190 250"/>
      <path d="M190 340 L190 360 L170 360"/>
      <path d="M90 360 L70 360 L70 340"/>
    </g>
    <text x="72" y="224" font-family="Space Mono, monospace" font-size="10" fill="#9bc1bc">cycle 0.88</text>
  </g>
  <!-- Reticle in corner -->
  <g transform="translate(550 60)" stroke="#edf1e8" stroke-width="1.5" fill="none" opacity="0.7">
    <circle r="28"/>
    <line x1="-40" y1="0" x2="-12" y2="0"/>
    <line x1="12" y1="0" x2="40" y2="0"/>
    <line x1="0" y1="-40" x2="0" y2="-12"/>
    <line x1="0" y1="12" x2="0" y2="40"/>
  </g>
  <!-- Header -->
  <text x="40" y="60" font-family="Playfair Display, serif" font-style="italic" font-size="26" fill="#edf1e8">computer vision</text>
  <text x="40" y="84" font-family="Space Mono, monospace" font-size="10" fill="#ed6a5a" letter-spacing="3">YOLO · OPENCV · PYTORCH</text>
</svg>
